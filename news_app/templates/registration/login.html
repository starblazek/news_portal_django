{% extends "base.html" %}

{% block title %}Вход - Новостной портал{% endblock %}

{% block content %}
<div class="form-shell">
    <div class="mb-4">
        <p class="text-uppercase text-muted mb-2">Авторизация</p>
        <h1 class="h3 mb-0">Войти на сайт</h1>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger">
            Неверное имя пользователя или пароль.
        </div>
    {% endif %}

    {% if next %}
        <div class="alert alert-info">
            Войдите, чтобы продолжить.
        </div>
    {% endif %}

    <form method="post" class="row g-3">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="col-12">
            <label class="form-label" for="{{ form.username.id_for_label }}">Имя пользователя</label>
            <input
                class="form-control"
                type="text"
                name="{{ form.username.html_name }}"
                id="{{ form.username.id_for_label }}"
                value="{{ form.username.value|default_if_none:'' }}"
                autocomplete="username"
                required
            >
        </div>

        <div class="col-12">
            <label class="form-label" for="{{ form.password.id_for_label }}">Пароль</label>
            <input
                class="form-control"
                type="password"
                name="{{ form.password.html_name }}"
                id="{{ form.password.id_for_label }}"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Войти</button>
            <a class="btn btn-outline-secondary" href="{% url 'home' %}">На главную</a>
        </div>
    </form>
</div>
{% endblock %}
